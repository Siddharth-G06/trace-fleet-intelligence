data:
  train_path: data/cmapss/train_FD001.txt
  test_path: data/cmapss/test_FD001.txt
  rul_path: data/cmapss/RUL_FD001.txt
  window_size: 30
  rul_cap: 125
  sensors_to_drop: [s1, s5, s6, s10, s16, s18, s19]
  scaler_path: models/scaler.pkl

health_score:
  healthy_threshold: 80
  watch_threshold: 50
  warning_threshold: 20

gemini:
  api_key: ""           # filled from os.environ GEMINI_API_KEY
  model: gemini-1.5-flash
  parser_temperature: 0.0
  synthesis_temperature: 0.3
  max_output_tokens: 500

reasoning:
  supported_query_types:
    - fleet_comparison
    - threshold_query
    - anomaly_hunt
    - ranking_query
    - trend_analysis
  default_top_n: 5
  default_threshold_cycles: 30
  group_a_units: [1, 50]     # unit_id range for Group A (simulated depot)
  group_b_units: [51, 100]   # unit_id range for Group B
  health_decline_window: 20  # cycles to compute decline rate over

chromadb:
  persist_dir: data/chromadb
  collection_name: trace_fleet_events

streamlit:
  page_title: "TRACE — Fleet Intelligence"
  page_icon: "🔍"
  layout: wide

model:
  hidden_size_1: 64
  hidden_size_2: 32
  dropout: 0.2
  dense_units: 16
  learning_rate: 0.001
  batch_size: 32
  max_epochs: 50
  early_stopping_patience: 10
  train_val_split: 0.8
  model_path: models/lstm_model.pth
  metadata_path: models/training_metadata.json

evidence:
  chromadb_persist_dir: data/chromadb
  collection_name: trace_fleet_events
  embedding_model: all-MiniLM-L6-v2
  top_k_results: 5
  health_drop_threshold: 5.0
  sustained_decline_window: 10
  recovery_threshold: 3.0
  relevance_display_threshold: 0.5
